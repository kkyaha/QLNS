<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý nhân sự</title>
    <link rel="stylesheet" href="css/site.css">
    <style>
        /* Login form styles */
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }

        .login-box {
            background: #fff;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0px 10px 40px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
        }

        .login-box h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
            font-size: 28px;
        }

        .login-box input {
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }

        .login-box input:focus {
            outline: none;
            border-color: #667eea;
        }

        .login-box button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: #fff;
            font-weight: bold;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .login-box button:hover {
            transform: translateY(-2px);
            box-shadow: 0px 5px 15px rgba(102, 126, 234, 0.4);
        }

        .login-box button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .error-message {
            color: #d32f2f;
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
            padding: 10px;
            background-color: #ffebee;
            border-radius: 6px;
            border: 1px solid #ffcdd2;
            display: none;
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 10px;
            color: #667eea;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* User info in sidebar */
        .user-info {
            padding: 15px 20px;
            background: #34495e;
            border-bottom: 1px solid #2c3e50;
            margin-bottom: 20px;
        }

        .user-info .username {
            font-weight: bold;
            margin-bottom: 10px;
            color: #ecf0f1;
        }

        .user-info .logout-btn {
            width: 100%;
            padding: 8px;
            background: #e74c3c;
            border: none;
            color: white;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }

        .user-info .logout-btn:hover {
            background: #c0392b;
        }

        /* Hidden class */
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <!-- Main Content (hiển thị khi đã đăng nhập) -->
    <div id="mainContainer" class="container hidden">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="user-info">
                <div class="username" id="userDisplayName">Xin chào, <span id="usernameDisplay"></span></div>
                <button class="logout-btn" onclick="handleLogout()">Đăng xuất</button>
            </div>
            <h2>Menu</h2>
            <ul>
                <li><a href="index.html" class="active">🏠 Trang chủ</a></li>
                <li><a href="pages/nhanvien.html">👤 Nhân viên</a></li>
                <li><a href="pages/chamcong.html">🕒 Chấm công</a></li>
                <li><a href="pages/phongban.html">🏢 Phòng ban</a></li>
                <li><a href="pages/chucvu.html">💼 Chức vụ</a></li>
                <li><a href="pages/luong.html">💰 Lương</a></li>
            </ul>
        </aside>

        <!-- Nội dung chính -->
        <main class="content">
            <h1>Chào mừng đến hệ thống quản lý nhân sự</h1>
            <p>Xin chào, <strong id="welcomeUsername"></strong>! Chọn một mục bên menu để tiếp tục.</p>
        </main>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/index.js"></script>
</body>
</html>
