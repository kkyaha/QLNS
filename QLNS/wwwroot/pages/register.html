<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký - Hệ thống quản lý nhân sự</title>
    <link rel="stylesheet" href="/css/site.css">
    <style>
        /* [COPY & PASTE TỪ TRANG LOGIN] - Đảm bảo đồng bộ 100% */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); /* Màu nền Gradient tím/xanh */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
        }

        /* Đổi tên class thành register-box nhưng giữ nguyên style của login-box */
        .register-box {
            background: #fff;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0px 10px 40px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
        }

            .register-box h2 {
                text-align: center;
                margin-bottom: 30px;
                color: #333;
                font-size: 28px;
            }

            .register-box input {
                width: 100%;
                padding: 14px;
                margin: 10px 0;
                border: 2px solid #e0e0e0;
                border-radius: 8px;
                font-size: 16px;
                box-sizing: border-box;
                transition: border-color 0.3s;
            }

                .register-box input:focus {
                    outline: none;
                    border-color: #667eea; /* Màu tím chủ đạo khi focus */
                }

            .register-box button {
                width: 100%;
                padding: 14px;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); /* Nút Gradient */
                border: none;
                color: #fff;
                font-weight: bold;
                font-size: 16px;
                border-radius: 8px;
                cursor: pointer;
                margin-top: 20px; /* Tăng khoảng cách một chút */
                transition: transform 0.2s, box-shadow 0.2s;
            }

                .register-box button:hover {
                    transform: translateY(-2px);
                    box-shadow: 0px 5px 15px rgba(102, 126, 234, 0.4);
                }

                .register-box button:active {
                    transform: translateY(0);
                }

                .register-box button:disabled {
                    opacity: 0.6;
                    cursor: not-allowed;
                    transform: none;
                }

        /* Style cho Link quay lại đăng nhập */
        .link-login {
            display: block;
            text-align: center;
            margin-top: 20px;
            text-decoration: none;
            color: #667eea; /* Màu tím nhạt */
            font-weight: 500;
            transition: color 0.2s;
        }

            .link-login:hover {
                color: #764ba2; /* Màu tím đậm khi hover */
                text-decoration: underline;
            }

        /* Các style phụ trợ (Loading, Error) giữ nguyên */
        .error {
            color: #d32f2f;
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
            padding: 10px;
            background-color: #ffebee;
            border-radius: 6px;
            border: 1px solid #ffcdd2;
            display: none;
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 10px;
            color: #667eea;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>
    <div class="register-box">
        <h2>Đăng Ký</h2>
        <form id="registerForm">
            <input type="text" id="username" placeholder="Tên đăng nhập" required autocomplete="username">
            <input type="password" id="password" placeholder="Mật khẩu" required autocomplete="new-password">
            <input type="password" id="confirmPassword" placeholder="Nhập lại mật khẩu" required autocomplete="new-password">

            <button type="submit" id="submitBtn">Đăng Ký Ngay</button>
        </form>

        <div class="loading" id="loading">
            <div class="spinner"></div>
        </div>

        <p class="error" id="errorMessage"></p>

        <a href="/pages/login.html" class="link-login">Đã có tài khoản? Đăng nhập</a>
    </div>

    <script src="/js/auth.js"></script>
    <script src="/js/register.js"></script>
</body>
</html>
